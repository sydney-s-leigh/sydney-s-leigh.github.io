<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Helix Unwrapped Animation</title>
  <style>
    canvas {
      border: 1px solid black;
      background: #fff;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const width = canvas.width;
    const height = canvas.height;

    const A = 80;             // Amplitude of sine wave
    const speed = 0.05;       // Speed of t increase
    const xScale = 40;        // How much horizontal space per unit of t
    const yOffset = height / 2;

    let t = 0;                // Time parameter
    let trail = [];           // Store past positions

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Draw trail
      ctx.beginPath();
      ctx.moveTo(trail[0]?.x || 0, trail[0]?.y || yOffset);
      for (let i = 1; i < trail.length; i++) {
        ctx.lineTo(trail[i].x, trail[i].y);
      }
      ctx.strokeStyle = "#0077cc";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Compute current point
      const x = t * xScale;
      const y = yOffset - A * Math.sin(t);  // Subtract to make sine go upward

      // Draw current point
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, 2 * Math.PI);
      ctx.fillStyle = "red";
      ctx.fill();

      // Save to trail
      trail.push({ x, y });

      // Advance time
      t += speed;

      // Restart if off-screen
      if (x > width) {
        t = 0;
        trail = [];
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
