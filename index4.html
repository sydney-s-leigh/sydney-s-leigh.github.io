<!doctype html>

<html>

<body>
    <div id="main" style="width:50%; margin-right:auto; margin-left: auto; border: 1px solid black;">
        <canvas id="myCanvas" style="display:block; margin-right:auto; margin-left: auto; border: 1px solid red;">Your
            browser
            doesn't support Canvas.</canvas>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        function y(x) {
            const A = 120; // Initial amplitude
            const k = 0.01; // Damping
            const w = 0.05; // Frequency
            return Math.abs(A * Math.exp(-k * x) * Math.cos(w * x));
        }

        let i = 0;

        // Start the drawing path
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - y(0));

        function draw() {
            const yi = canvas.height - y(i);
            ctx.lineTo(i, yi);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.stroke();

            i += 0.5;

            // Once we hit the canvas edge, reset
            if (i >= canvas.width) {
                i = 0;
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
                ctx.beginPath(); // Start a new path
                ctx.moveTo(0, canvas.height - y(0)); // Reset starting point
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>

</html>
