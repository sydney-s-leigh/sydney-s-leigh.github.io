<!doctype html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Damped Letter Playground</title>
    <style>
        body {
            background: #111;
            margin: 0;
            overflow: hidden;
        }

        /*
        canvas {
            display: block;
            margin: 0 auto;
            background: #222;
        }*/
    </style>
</head>

<body>
    <div id="main" style="margin-top:250px; width:50%; margin-right:auto; margin-left: auto; border: 1px solid black;">
        <canvas id="myCanvas" style="width:100%; display:block; margin-right:auto; margin-left: auto; border: 1px solid red;">Your
            browser
            doesn't support Canvas.</canvas>
    </div>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        const phrase = "Welcome to my Playground!";
        const minFont = 24; // Minimum font size
        const maxFont = 68; // Maximum font size
        const minA = 50;
        const maxA = 150;
        const mink = 0.02;
        const maxk = 0.02;
        const minw = 0.05;
        const maxw = 0.05;

        const durationBeforeReset = 5000; // 10 seconds at rest

        class Letter {
            constructor(char, index, total) {
                this.char = char;
                this.fontSize = Math.floor(Math.random() * (maxFont - minFont)) + minFont;
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                //this.direction = Math.random() < 0.5 ? 1 : -1;
                this.direction = 1;
                this.A = Math.random() * (maxA - minA) + minA;
                this.k = Math.random() * (maxk - mink) + mink;
                this.w = Math.random() * (maxw - minw) + minw;
                this.speed = Math.random() * 0.75 + 0.25;
                this.x = this.direction === 1 ? 0 : canvas.width;
                this.done = false;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() < 0.5 ? -1 : 1) * 0.01;
                this.index = index;
                this.total = total;
                this.finalX = canvas.width / 2 - ctx.measureText(phrase).width / 2 + index * 14;
                this.finalY = canvas.height - 5;
            }

            //This is the function on how they bounce
            letterBounceCurve(x) {
                return Math.abs(this.A * Math.exp(-this.k * x) * Math.cos(this.w * x));
            }

            update() {
                if (!this.done) {
                    this.rotation += this.rotationSpeed;

                    if (this.direction === 1) {
                        this.x += this.speed;
                        if (this.x > canvas.width) this.done = true;
                    } else {
                        this.x -= this.speed;
                        if (this.x < 0) this.done = true;
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, canvas.height - this.letterBounceCurve(this.x));
                ctx.rotate(this.rotation);
                ctx.font = `${this.fontSize}px Arial`;
                ctx.fillStyle = this.color;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.char, 0, 0);
                ctx.restore();
            }
        }

        let letters = [];
        let animating = true;
        let resting = false;
        let restStartTime = 0;

        function initLetters() {
            letters = phrase.split("").map((char, i) => new Letter(char, i, phrase.length));
        }

        function allLettersDone() {
            return letters.every(l => l.done);
        }

        function drawFinalPhrase() {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = `18px Arial`;
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText(phrase, canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (animating) {
                letters.forEach(letter => {
                    letter.update();
                    letter.draw(ctx);
                });

                if (allLettersDone()) {
                    animating = false;
                    resting = true;
                    restStartTime = Date.now();
                    drawFinalPhrase();
                }
            } else if (resting) {
                drawFinalPhrase();
                if (Date.now() - restStartTime > durationBeforeReset) {
                    initLetters();
                    animating = true;
                    resting = false;
                }
            }

            requestAnimationFrame(animate);
        }

        initLetters();
        animate();
    </script>
</body>

</html>
