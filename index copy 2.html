<!doctype html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Damped Letter Playground</title>
    <style>
        body {
            background: #111;
            margin: 0;
            overflow: hidden;
        }

        /*
        canvas {
            display: block;
            margin: 0 auto;
            background: #222;
        }*/
    </style>
</head>

<body>
    <div id="main" style="margin-top:250px; width:50%; margin-right:auto; margin-left: auto; border: 1px solid black;">
        <canvas id="myCanvas"
            style="width:100%; display:block; margin-right:auto; margin-left: auto; border: 1px solid red;">Your
            browser
            doesn't support Canvas.</canvas>
    </div>

    <script>
        /****************************************************************
         * Author : Sydney Leigh
         * Date : 07/27/2025
         * Purpose: This script takes a phrase and does an animation with
         * the letters where each letters has a random bounce height,
         * random color, random huge shift, and random size. Then at the
         * end it takes the letter's position and aligns the whole phrase
         * again in the middle.
         * *************************************************************/
        
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        const phrase = "Welcome to my Playground!";
        const minFont = 24;
        const maxFont = 68;
        const minA = 50;
        const maxA = 150;
        const minSpeed = 0.5;
        const maxSpeed = 2.0;
        const minHueSpeed = 0.2;
        const maxHueSpeed = 1.0;
        const gravity = 0.1;
        const bounceDamping = 0.6;
        const settleDuration = 5000;

        class Letter {
            constructor(char, index, total) {
                this.char = char;
                this.fontSize = Math.random() * (maxFont - minFont) + minFont;
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.vy = Math.random() * -5 - 5; // initial upward velocity
                this.settleX = 0; // will be set later
                this.settleY = canvas.height / 2;
                this.stopHeight = Math.floor(Math.random() * (canvas.height/2));
                this.settleFontSize = 18;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() < 0.5 ? -1 : 1) * 0.01;
                this.hue = Math.random() * 360;
                this.hueSpeed = Math.random() * (maxHueSpeed - minHueSpeed) + minHueSpeed;
                this.speed = Math.random() * (maxSpeed - minSpeed) + minSpeed;
                this.bounced = false;
                this.done = false;
                this.index = index;
                this.total = total;
                this.letterCurve = (x) => Math.abs((Math.random() * 100 + 50) * Math.exp(-0.02 * x) * Math.cos(
                    0.05 * x));
            }

            update() {
                if (!this.done) {
                    this.rotation += this.rotationSpeed;
                    this.hue = (this.hue + this.hueSpeed) % 360;

                    this.y += this.vy;
                    this.vy += gravity;

                    if (this.y >= canvas.height - this.letterCurve(this.x)) {
                        this.y = canvas.height - this.letterCurve(this.x);
                        this.vy = -this.vy * bounceDamping;
                        // if(this.stopHeight == this.vy){
                        //     this.done = true;
                        // }
                         if (Math.abs(this.vy) < 1) {
                             this.done = true;
                         }
                    }
                } else {
                    this.rotation = 0;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.fontSize}px Arial`;
                ctx.fillStyle = `hsl(${this.hue}, 80%, 60%)`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.char, 0, 0);
                ctx.restore();
            }

            settleToPosition(x, y) {
                this.x = x;
                this.y = y;
                this.fontSize = this.settleFontSize;
            }
        }

        let letters = [];
        let animating = true;
        let resting = false;
        let restStartTime = 0;

        function initLetters() {
            letters = phrase.split("").map((char, i) => new Letter(char, i, phrase.length));
        }

        function allLettersDone() {
            return letters.every(l => l.done);
        }

        //Sets the final x and y coordinates the letter should be at
        function settleLetters() {
            const spacing = canvas.width / (phrase.length + 1);
            letters.forEach((l, i) => {
                const x = spacing * (i + 1);
                l.settleToPosition(x, canvas.height / 2);
            });
        }

        function drawFinalPhrase() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            letters.forEach(l => l.draw(ctx));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (animating) {
                letters.forEach(l => {
                    l.update();
                    l.draw(ctx);
                });

                if (allLettersDone()) {
                    animating = false;
                    resting = true;
                    restStartTime = Date.now();
                    settleLetters();
                }
            } else if (resting) {
                drawFinalPhrase();
                if (Date.now() - restStartTime > settleDuration) {
                    initLetters();
                    animating = true;
                    resting = false;
                }
            }

            requestAnimationFrame(animate);
        }

        initLetters();
        animate();
    </script>
</body>

</html>
