<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Trajectory with Wind</title>
    <style>
        canvas {
            display: block;
            margin: 20px auto;
            border: 1px solid #333;
            background: #fefefe;
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const width = canvas.width;
        const height = canvas.height;

        // Physics parameters
        const vx = 100; // initial horizontal velocity (pixels/second)
        const aw = 30; // horizontal acceleration (wind)
        const g = 150; // gravity (pixels/second^2)
        const y0 = height - 50; // initial vertical position
        const fps = 60; // frames per second
        const dt = 1 / fps; // time increment per frame

        let t = 0; // time in seconds
        let trail = [];

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Compute new position
            const x = vx * t + 0.5 * aw * t * t;
            const y = y0 - 0.5 * g * t * t;

            // Store in trail
            trail.push({
                x,
                y
            });

            // Draw trail
            ctx.beginPath();
            if (trail.length > 1) {
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
            }
            ctx.strokeStyle = "#0077cc";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw current point
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = "red";
            ctx.fill();

            // Advance time
            t += dt;

            // Restart when point exits canvas
            if (x > width || y > height || y < 0) {
                t = 0;
                trail = [];
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>

</html>
